services:
  - type: web
    name: llmlingua-v4-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SPACE_APP_API_KEY
        sync: false
      - key: HF_SPACE_ID
        value: Shrivatsanaik7/llmlingua-v4-api
      - key: HF_SPACE_API_NAME
        value: /compress
      - key: MAX_PROMPT_CHARS
        value: "20000"

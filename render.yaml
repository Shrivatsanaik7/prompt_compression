services:
  - type: web
    name: llmlingua-v4-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HF_SPACE_ID
        value: Shrivatsanaik7/llmlingua-v4-api
      - key: HF_SPACE_API_NAME
        value: /compress

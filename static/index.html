
<div class="input-section">

    <label for="promptInput">Your original prompt</label>

    <textarea
        id="promptInput"
        placeholder="Enter your prompt here..."
        maxlength="20000"
    ></textarea>

    <p id="charCount">0 characters</p>

    <div class="compression-section">

        <label for="compressionRange">
            Target Compression Reduction
            <span id="rangeValue">30%</span>
        </label>

        <select id="compressionRange">
            <option value="20">20%</option>
            <option value="30" selected>30%</option>
            <option value="40">40%</option>
            <option value="50">50%</option>
            <option value="60">60%</option>
        </select>

    </div>

    <button id="compressBtn" type="button">
        Compress with V4 ↗
    </button>

</div>

<div class="output-section">

    <h3>Compressed Prompt</h3>

    <pre id="output">Your compressed prompt will appear here.</pre>

    <h3>Compression Statistics</h3>

    <p>Original Tokens: <span id="originalTokens">-</span></p>

    <p>Compressed Tokens: <span id="compressedTokens">-</span></p>

    <p>Compression Ratio: <span id="compressionRatio">-</span></p>

</div>

<script src="/static/app.js"></script>

<textarea id="promptInput" placeholder="Enter your prompt here..."></textarea>

<label>
    Compression Reduction:
    <span id="rangeValue">30%</span>
</label>

<input
    type="range"
    id="compressionRange"
    min="20"
    max="60"
    step="10"
    value="30"
>

<button id="compressBtn">
    Compress Prompt
</button>

<h3>Compressed Prompt</h3>

<pre id="output"></pre>

<h3>Compression Statistics</h3>

<p>Original Tokens: <span id="originalTokens">-</span></p>

<p>Compressed Tokens: <span id="compressedTokens">-</span></p>

<p>Compression Ratio: <span id="compressionRatio">-</span></p>

<script src="/static/app.js"></script>
